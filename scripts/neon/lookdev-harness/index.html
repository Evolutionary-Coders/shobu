<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>look-dev no babylon</title>
    <style>
      html, body { margin: 0; background: #000; overflow: hidden; }
      canvas { width: 1600px; height: 900px; display: block; }
      /* a gradação de cor do jogo (`hud.css`), que só QUALIDADE e EQUILIBRADO têm. */
      :root[data-grading="on"] canvas { filter: saturate(1.18) contrast(1.08) brightness(0.94) sepia(0.08) hue-rotate(-12deg); }
    </style>
  </head>
  <body>
    <canvas id="lookdev" width="1600" height="900"></canvas>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
