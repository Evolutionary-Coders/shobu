; o controle de uma mão do shōbu em cardboard: ESP32 DevKit como gamepad BLE HID.
; `pio run -t upload` grava, `pio device monitor` mostra o log de calibração.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; a ESP32-BLE-Gamepad a partir da 0.7 roda sobre o NimBLE (a pilha bluedroid
; do arduino come ~100 kB a mais de ram e flash), e declara a dependência ela
; mesma; o NimBLE vai explícito para a versão não andar sozinha entre builds.
lib_deps =
    lemmingdev/ESP32-BLE-Gamepad@^0.7.4
    h2zero/NimBLE-Arduino@^2.1.0
