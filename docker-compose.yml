# `docker compose up --build` sobe o shōbu em http://localhost:2567.
# Os valores da Feira e da voz vêm do `.env` da raiz (fora do git e da imagem);
# sem ele, o servidor sobe sem crédito e sem voz.
services:
  shobu:
    build:
      context: .
      args:
        # fixadas no bundle do cliente; vazias = padrão do código.
        VITE_GAME_SERVER_URL: ${VITE_GAME_SERVER_URL:-}
        VITE_VOICE_SERVER_URL: ${VITE_VOICE_SERVER_URL:-}
    image: shobu:local
    ports:
      - "${PORT:-2567}:2567"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "2567"
    restart: unless-stopped
