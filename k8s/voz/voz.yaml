# A sinalização da voz passa pelo Gateway, num host próprio, até a porta 7880 do servidor
# de jogo. A mídia não passa: vai direto ao nó pelo NodePort.
---
apiVersion: v1
kind: Service
metadata:
  name: shobu-voz
  namespace: feira-de-jogos
spec:
  selector:
    app: shobu
  ports:
    - port: 7880
      targetPort: 7880
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shobu-voz
  namespace: feira-de-jogos
spec:
  parentRefs:
    - name: gateway-feira-de-jogos
      sectionName: https-shobu-voz
  hostnames:
    - "shobu-voz.feira-de-jogos.dev.br"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shobu-voz
          port: 7880
---
apiVersion: v1
kind: Service
metadata:
  name: shobu-midia
  namespace: feira-de-jogos
spec:
  type: NodePort
  # só o nó onde o pod roda atende, que é o IP que o LiveKit anuncia (NODE_IP).
  externalTrafficPolicy: Local
  selector:
    app: shobu
  ports:
    - name: ice-tcp
      protocol: TCP
      port: 30781
      targetPort: 30781
      nodePort: 30781
    - name: rtp-udp
      protocol: UDP
      port: 30782
      targetPort: 30782
      nodePort: 30782
